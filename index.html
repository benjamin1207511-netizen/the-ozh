<body>
<div class="container">
    <div class="section">
        <div class="section-header">
            <h2>特别天气提醒</h2>
            <span class="publish-time">2026-05-10 11:40 发布</span>
        </div>
        <div class="section-content">
            <p id="weather-trend">受高空反气旋影响，下周初珠海天色好转。一股活跃偏南气流会在下周后期为广东沿岸带来大骤雨及狂风雷暴，雨势有时颇大。预料该偏南气流会在下周末被一股偏东气流取代</p>
        
        </div>
    </div>
