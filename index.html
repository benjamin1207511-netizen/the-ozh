<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>天气预报</title>
    <link rel="stylesheet" href="/the-ozh/style.css">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>
<body>
<div class="container">
    <div class="section">
        <div class="section-header">
            <h2>天气趋势</h2>
            <span class="publish-time">2024-05-20 10:00 发布</span>
        </div>
        <div class="section-content">
            <p id="weather-trend">未来七天以晴转多云为主，气温逐渐回升，昼夜温差较大</p>
        </div>
    </div>

    <div class="section">
        <div class="section-header tabs">
            <h2 class="active">七天天气预报</h2>
            <a href="admin.html" style="color:#fff;margin-left:auto;">后台管理</a>
        </div>
        <div class="section-content forecast-grid">
            <!-- 第一天 -->
            <div class="forecast-day">
                <p class="day-name">今天</p>
                <div class="weather-icon">☀️</div>
                <div class="temp-line">
                    <span class="high-temp">28℃</span>
                    <span class="low-temp">18℃</span>
                </div>
            </div>
            <!-- 第二天 -->
            <div class="forecast-day">
                <p class="day-name">明天</p>
                <div class="weather-icon">⛅</div>
                <div class="temp-line">
                    <span class="high-temp">29℃</span>
                    <span class="low-temp">19℃</span>
                </div>
            </div>
            <!-- 第三天 -->
            <div class="forecast-day">
                <p class="day-name">后天</p>
                <div class="weather-icon">⛅</div>
                <div class="temp-line">
                    <span class="high-temp">30℃</span>
                    <span class="low-temp">20℃</span>
                </div>
            </div>
            <!-- 第四天 -->
            <div class="forecast-day">
                <p class="day-name">周四</p>
                <div class="weather-icon">☀️</div>
                <div class="temp-line">
                    <span class="high-temp">31℃</span>
                    <span class="low-temp">21℃</span>
                </div>
            </div>
            <!-- 第五天 -->
            <div class="forecast-day">
                <p class="day-name">周五</p>
                <div class="weather-icon">🌤️</div>
                <div class="temp-line">
                    <span class="high-temp">32℃</span>
                    <span class="low-temp">22℃</span>
                </div>
            </div>
            <!-- 第六天 -->
            <div class="forecast-day">
                <p class="day-name">周六</p>
                <div class="weather-icon">🌤️</div>
                <div class="temp-line">
                    <span class="high-temp">31℃</span>
                    <span class="low-temp">21℃</span>
                </div>
            </div>
            <!-- 第七天 -->
            <div class="forecast-day">
                <p class="day-name">周日</p>
                <div class="weather-icon">☀️</div>
                <div class="temp-line">
                    <span class="high-temp">30℃</span>
                    <span class="low-temp">20℃</span>
                </div>
            </div>
        </div>
        <div class="publish-info">2024-05-20 10:00 发布</div>
    </div>
</div>

<div class="sidebar">
    <div class="section">
        <div class="section-header"><h2>预警信息</h2></div>
        <div class="section-content">
            <p>当前无气象预警信息</p>
        </div>
    </div>
</div>
</body>
</html>
